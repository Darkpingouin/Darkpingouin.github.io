<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atlas musculaire et postural du chien</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Arimo:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: planche photo à gauche, fiche du muscle à droite ; empilées sur mobile */
:root{
  --bg:#d7cabe; --panel:#fbf8f4; --plate:#ffffff; --ink:#231d19; --muted:#5a4f46; --line:#c8b8a8;
  --hl:#c4203a; --edge:#231d19;
  --dorsal:#2f6db5; --ventral:#b56d0c; --thorax:#7b4bb0; --ant:#1f8a70; --post:#c4203a;
  --f-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --f-body:"Arimo", Arial, "Liberation Sans", sans-serif;
  --f-mono:var(--f-body);
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.draft{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px dashed var(--line);padding:4px 8px;border-radius:4px}
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{font:600 14px var(--f-body);color:var(--muted);background:none;border:0;padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-body);border:1.5px solid var(--c,var(--line));color:var(--ink);background:var(--panel);border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.chip[aria-pressed="true"] i{background:#fff}
button:focus-visible,g.mg:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .plate{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 14px -10px rgba(35,29,25,.5)}
  .hint{font-size:12px;margin-top:4px}
  aside{padding:16px}
  aside h2{font-size:23px}
}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.plate svg{width:100%;height:auto;display:block;touch-action:manipulation}
.hint{font-size:13px;color:var(--muted);margin:6px 4px 0}
g.mg{cursor:pointer;outline:none}
g.mg path{fill:var(--c,var(--hl));fill-opacity:0;stroke:#ffffff;stroke-opacity:0;stroke-width:3;transition:fill-opacity .15s,stroke-opacity .15s}
svg.outlines g.mg path{stroke-opacity:.95;stroke-dasharray:10 6;fill-opacity:.12;fill:#ffffff}
svg g.mg.hover path{fill:var(--hl);fill-opacity:.35;stroke:var(--hl);stroke-opacity:1;stroke-dasharray:none}
svg g.mg.on path{fill:var(--hl);fill-opacity:.55;stroke:var(--hl);stroke-opacity:1;stroke-dasharray:none;stroke-width:4}
svg g.mg.inchain path{fill:var(--c);fill-opacity:.55;stroke:var(--c);stroke-opacity:1;stroke-dasharray:none}
#deep{pointer-events:none}
#deepPath{fill:var(--c);fill-opacity:.32;stroke:var(--c);stroke-width:3;stroke-dasharray:14 8;display:none}
#deepPath.show{display:inline}
.badge{pointer-events:none}
.badge circle{fill:#1d2827;stroke:#ffffff;stroke-width:3}
.badge text{font:600 22px var(--f-mono);fill:#ffffff;text-anchor:middle;dominant-baseline:central}
.badge.on circle{fill:var(--hl)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
aside h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
.latin{font-family:var(--f-body);font-style:italic;font-size:14px;color:var(--muted);margin-top:2px}
.sec h3{font:700 13px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sec h3 b{width:8px;height:8px;border-radius:2px;background:var(--k,var(--muted))}
.sec p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.mbtn{font:600 13px var(--f-body);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;text-align:left}
.mbtn:hover{border-color:var(--hl)}
.mbtn[aria-pressed="true"]{border-color:var(--hl);background:var(--panel)}
.mbtn small{font:600 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.empty{color:var(--muted)}
.sec p.precis{color:var(--muted);font-size:15px}
.note{margin:8px 0 0;font-size:14px;color:var(--muted)}
.roles{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.status{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;border:1px dashed var(--muted);letter-spacing:.04em}
.status.ok{border:1px solid var(--ant);color:var(--ant)}
.index{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.index h3{font:700 13px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 20px}
.zones h4{font:700 16px var(--f-display);margin:0 0 6px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const byId=Object.fromEntries(M.map((m,i)=>{m.n=m.n||i+1;return[m.id,m]}));
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("horse"), gM=document.getElementById("muscles"), gB=document.getElementById("badges");
const nodes={}, badges={};
const state={mode:"m",sel:null,chain:null};
const cvar=k=>`var(${CHAINS[k].couleur})`;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

M.forEach(m=>{
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","mg"); g.setAttribute("tabindex","0");
  g.setAttribute("role","button"); g.setAttribute("aria-label",`${m.n}. ${m.nom}`);
  const p=document.createElementNS(NS,"path"); p.setAttribute("d",m.d);
  const t=document.createElementNS(NS,"title"); t.textContent=`${m.n}. ${m.nom}`;
  g.append(t,p); gM.append(g); nodes[m.id]=g; m.path=p;
});
M.filter(m=>m.top).forEach(m=>gM.append(nodes[m.id]));
M.forEach(m=>{const g=nodes[m.id];
  g.addEventListener("pointerenter",e=>{ if(e.pointerType==="touch") return; if(state.mode==="m"){g.classList.add("hover"); if(!state.sel) showMuscle(m.id,true);} });
  g.addEventListener("pointerleave",()=>{ g.classList.remove("hover"); if(state.mode==="m"&&!state.sel) showIntro(); });
  g.addEventListener("click",()=>selectMuscle(m.id));
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();selectMuscle(m.id);} });
});

function inner(p){
  const b=p.getBBox(); let best=null, bd=1e9;
  const cx=b.x+b.width/2, cy=b.y+b.height/2;
  for(let i=0;i<=12;i++)for(let j=0;j<=12;j++){
    const x=b.x+b.width*i/12, y=b.y+b.height*j/12;
    let inside=false; try{ inside=p.isPointInFill(new DOMPoint(x,y)); }catch(e){ inside=p.isPointInFill(Object.assign(svg.createSVGPoint(),{x,y})); }
    if(!inside) continue;
    const d=(x-cx)**2+(y-cy)**2; if(d<bd){bd=d;best=[x,y];}
  }
  return best||[cx,cy];
}
M.forEach(m=>{
  const [x,y]=m.bx?[m.bx,m.by]:inner(m.path);
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","badge");
  g.innerHTML=`<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y+1}">${m.n}</text>`;
  gB.append(g); badges[m.id]=g;
});

const info=document.getElementById("info");
function showIntro(){
  info.innerHTML=`<div class="eyebrow">Mode d'emploi</div><h2>Choisis un muscle</h2>
  <p>Survole un muscle pour un aperçu, clique pour figer sa fiche. Sur téléphone, touche simplement le muscle. Le mode <b>Chaînes</b> allume tous les muscles d'une même chaîne. Les boutons <b>Contours</b> et <b>Numéros</b> affichent toutes les zones d'un coup.</p>
  <p class="empty">${M.length} muscles · ${Object.keys(CHAINS).length} chaînes</p>`;
}
const linkBtns=ids=>ids.map(i=>`<button class="mbtn" data-m="${i}" aria-pressed="${state.sel===i}"><small>${byId[i].n}</small>${esc(byId[i].nom)}</button>`).join("");
const chainBtns=ids=>ids.map(k=>`<button class="chip" style="--c:${cvar(k)}" data-c="${k}"><i></i>${esc(CHAINS[k].nom)}</button>`).join("");
function showMuscle(id,preview){
  const m=byId[id];
  const role=Array.isArray(m.role)?`<ul class="roles">${m.role.map(([t,d])=>`<li><b>${esc(t)}.</b> ${esc(d)}</li>`).join("")}</ul>`:`<p>${esc(m.role)}</p>`;
  info.innerHTML=`<div><div class="eyebrow">${preview?"Aperçu":"Muscle"} n° ${m.n} · ${esc(m.zone)}</div><h2>${esc(m.nom)}</h2><div class="latin">${esc(m.latin)}</div>${m.note?`<p class="note">${esc(m.note)}</p>`:""}</div>
  <div class="sec"><h3>À quoi il sert</h3>${role}</div>
  <div class="sec"><h3>À qui il est lié</h3><p>${esc(m.liensTxt)}</p>${preview?"":`<div class="links" style="margin-top:8px">${linkBtns(m.liens)}</div>`}</div>
  ${m.chaines.length?`<div class="sec"><h3>Chaînes</h3><div class="chips">${preview?m.chaines.map(k=>esc(CHAINS[k].nom)).join(" · "):chainBtns(m.chaines)}</div></div>`:""}
  ${m.groupe?`<div class="sec"><h3>Groupe fonctionnel</h3><p><b>${esc(m.groupe[0])}</b></p><p class="precis">${esc(m.groupe[1])}</p></div>`:""}
  <div class="sec" style="--k:var(--ventral)"><h3><b></b>Atrophié</h3><p>${esc(m.atrophie)}</p></div>
  <div class="sec" style="--k:var(--hl)"><h3><b></b>Hypertrophié ou contracté</h3><p>${esc(m.hyper)}</p></div>`;
}
function showChain(k){
  const c=CHAINS[k], ids=M.filter(m=>m.chaines.includes(k)).map(m=>m.id);
  info.innerHTML=`<div><div class="eyebrow">Chaîne</div><h2 style="color:${cvar(k)}">${esc(c.nom)}</h2></div>
  <div class="sec"><h3>Rôle</h3><p>${esc(c.role)}</p></div>
  ${c.profond?`<div class="sec"><h3>${esc(c.traceTitre||"Muscles profonds")}</h3><p>${esc(c.profond)}</p></div>`:""}
  <div class="sec"><h3>Ce qu'on lit sur le chien</h3><p>${esc(c.lecture)}</p></div>
  <div class="sec"><h3>Muscles de la chaîne</h3><div class="links">${linkBtns(ids)}</div></div>`;
}
function paint(){
  M.forEach(m=>{
    const g=nodes[m.id]; g.classList.remove("on","inchain"); g.style.removeProperty("--c");
    badges[m.id].classList.toggle("on",state.mode==="m"&&state.sel===m.id);
    if(state.mode==="m"&&state.sel===m.id) g.classList.add("on");
    if(state.mode==="c"&&state.chain&&m.chaines.includes(state.chain)){g.classList.add("inchain");g.style.setProperty("--c",cvar(state.chain));}
  });
  const dp=document.getElementById("deepPath"), ch=state.mode==="c"&&state.chain&&CHAINS[state.chain].trace;
  dp.classList.toggle("show",!!ch); if(ch){dp.setAttribute("d",CHAINS[state.chain].trace);dp.style.setProperty("--c",cvar(state.chain));}
  document.querySelectorAll("#chainChips .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===state.chain));
  document.querySelectorAll("#list .mbtn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===state.sel));
}
function selectMuscle(id){
  if(state.mode!=="m") setMode("m",true);
  state.sel=state.sel===id?null:id; paint(); state.sel?showMuscle(id,false):showIntro();
  revealInfo();
}
function revealInfo(){
  if(!window.matchMedia("(max-width:900px)").matches) return;
  const plate=document.querySelector(".plate"), top=info.getBoundingClientRect().top+window.scrollY-plate.offsetHeight-12;
  if(top>window.scrollY) window.scrollTo({top,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function selectChain(k){ setMode("c",true); state.chain=k; paint(); showChain(k); revealInfo(); }
function setMode(md,silent){
  state.mode=md;
  modeM.setAttribute("aria-pressed",md==="m"); modeC.setAttribute("aria-pressed",md==="c");
  chainChips.hidden=md!=="c";
  if(!silent){ state.sel=null; state.chain=md==="c"?(state.chain||"dorsale"):null; paint(); md==="c"?showChain(state.chain):showIntro(); }
}
const modeM=document.getElementById("modeM"), modeC=document.getElementById("modeC"), chainChips=document.getElementById("chainChips");
modeM.onclick=()=>setMode("m"); modeC.onclick=()=>setMode("c");
chainChips.innerHTML=chainBtns(Object.keys(CHAINS));
const MS=[...M].sort((a,b)=>a.n-b.n); const zones=[...new Set(MS.map(m=>m.zone))];
document.getElementById("list").innerHTML=zones.map(z=>`<div><h4>${esc(z)}</h4><div class="links">${linkBtns(MS.filter(m=>m.zone===z).map(m=>m.id))}</div></div>`).join("");
document.addEventListener("click",e=>{
  const mb=e.target.closest("[data-m]"); if(mb){ const id=mb.dataset.m; if(state.sel===id) state.sel=null; selectMuscle(id); return; }
  const cb=e.target.closest("[data-c]"); if(cb) selectChain(cb.dataset.c);
});
function toggle(btn,fn){ btn.onclick=()=>{const on=btn.getAttribute("aria-pressed")!=="true"; btn.setAttribute("aria-pressed",on); fn(on);}; }
toggle(document.getElementById("outBtn"),on=>svg.classList.toggle("outlines",on));
toggle(document.getElementById("numBtn"),on=>{gB.style.display=on?"":"none";});
showIntro();
</script>
